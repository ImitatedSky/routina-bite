schema: spec-driven

context: |
  Routina Bite —— 熱量飲食紀錄的 Android App，Routina 家族的獨立成員（applicationId `com.routina.bite`）。
  Tech stack: Kotlin 2.4 + AGP 9.3（Kotlin 支援內建，不套 kotlin.android 外掛）、Jetpack Compose Material 3、
  navigation-compose、kotlinx.serialization JSON 本地檔案儲存（無資料庫、無後端、無帳號、不連網）、
  版本目錄 gradle/libs.versions.toml。compileSdk 37 / targetSdk 35 / minSdk 26，R8 minify。
  Manifest 零 uses-permission；備份走系統文件選擇器。
  發佈: GitHub Releases，`vX.Y.Z` 標籤附 `routina-bite-vX.Y.Z.apk`，家族共用一把 release keystore（CI 的 KEYSTORE_* secret）。
  家族契約只用 manifest meta-data + Intent extras（字串約定），本 repo 自留一份 `family/Family.kt`，
  不引用 Hub 的 library；權威定義在 Hub 的 core/contract/Family.kt。
  UI 語言: 繁體中文。設計原則: 簡單圓角色塊 + 文字說明，不做擬物造型；顏色只做分組輔助、辨識靠文字；
  顏色面積要小（不整塊飽和填色）；中文不用 Bold/SemiBold（Android ≤14 的 zh-Hant 只有 weight 400，會合成假粗），
  層級用字級與深淺做，數字才用字重；刪除走溢位選單不用滑動刪除。
  程式碼直白、像一般工程師寫的，註解精簡只講程式碼看不出的原因。
  原則: 最簡實作、先能動再加功能、避免投機性抽象；長期決策不接受過渡方案。
  Commit message 一律英文、不含 Co-Authored-By。只 push main，tag 由使用者決定何時打。
